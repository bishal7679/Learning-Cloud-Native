apiVersion: v1
kind: Pod
metadata:
  name: cpu-mem-demo2
spec:
  containers:
  - name: cpu-mem-demo2
    image: saiyam911/stress
    resources:
      limits:
        cpu: "1"
        # cpu: "3"
        memory: "200Mi"
      requests:
        cpu: "500m"
        # cpu: "3"   # this will create the pod creationstate pending for insufficient CPU core
        memory: "100Mi"
    command: ["stress"]
    # args: ["--cpu","2"]   # used to asking the request to increase the resources
    args: ["--vm", "1", "--vm-bytes", "25M", "--vm-hang", "1"]