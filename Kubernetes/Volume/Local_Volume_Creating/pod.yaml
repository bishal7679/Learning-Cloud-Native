apiVersion: v1
kind: Pod
metadata:
  name: test-pv-pod
spec:
  volumes:
    - name: pv-vol
      persistentVolumeClaim:
        claimName: demo-pvclaim
  containers:
    - name: pv-pod
      image: nginx
      ports:
       - containerPort: 80
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: pv-vol